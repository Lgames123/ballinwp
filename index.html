<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ballin Mode</title>
  <style>
    :root {
      --court-1: #ffb347;
      --court-2: #ff6a00;
      --court-3: #ffd966;
      --ink: #1f1308;
      --glow: #ffe8a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--court-3), var(--court-1) 45%, var(--court-2));
      position: relative;
      display: grid;
      place-items: center;
    }

    .overlay-text {
      position: absolute;
      top: 2vh;
      width: 100%;
      text-align: center;
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      color: var(--ink);
      text-shadow: 0 0 10px var(--glow), 4px 4px 0 #ffffff;
      letter-spacing: 0.08em;
      z-index: 2;
      transform: rotate(-2deg);
      animation: wiggle 1.6s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    .autoplay-hint {
      position: absolute;
      bottom: 2vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.9rem;
      display: none;
    }

    .video-wrap {
      position: relative;
      z-index: 2;
      padding: 14px;
      border: 5px dashed #6c2d00;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.34);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 0 10px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(2px);
    }

    video {
      width: min(82vw, 900px);
      max-height: 72vh;
      border-radius: 14px;
      display: block;
      border: 4px solid #2a1709;
      background: #000;
    }

    .ball {
      position: absolute;
      font-size: var(--size);
      line-height: 1;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      animation: waterfall var(--dur) linear infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.25));
      user-select: none;
      pointer-events: none;
      z-index: 1;
      will-change: transform;
    }

    @keyframes waterfall {
      0% {
        transform: translate3d(0, -18vh, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(0, 118vh, 0) rotate(720deg);
      }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="overlay-text">WE BALLIN</div>
  <div id="autoplayHint" class="autoplay-hint">Autoplay blocked by browser policy. Use run-ballin.ps1 for forced autoplay.</div>

  <div class="video-wrap">
    <video autoplay loop muted playsinline controls>
      <source src="ballin.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <audio id="ballinAudio" autoplay loop preload="auto">
    <source src="ballinsong.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const audio = document.getElementById('ballinAudio');
    const hint = document.getElementById('autoplayHint');

    const playAudioNow = async () => {
      try {
        audio.currentTime = Math.max(0, audio.currentTime);
        audio.volume = 1;
        await audio.play();
        hint.style.display = 'none';
      } catch {
        hint.style.display = 'block';
      }
    };

    playAudioNow();
    window.addEventListener('load', playAudioNow);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        playAudioNow();
      }
    });
    audio.addEventListener('canplaythrough', playAudioNow, { once: true });
    window.addEventListener('pointerdown', playAudioNow, { once: true });
    window.addEventListener('keydown', playAudioNow, { once: true });

    const count = 34;
    for (let i = 0; i < count; i++) {
      const ball = document.createElement('div');
      ball.className = 'ball';
      const size = 26 + Math.random() * 42;
      const delay = -Math.random() * 10;
      const dur = 4 + Math.random() * 5;
      ball.textContent = String.fromCodePoint(0x1F3C0);
      ball.style.setProperty('--size', `${size}px`);
      ball.style.setProperty('--delay', `${delay}s`);
      ball.style.setProperty('--dur', `${dur}s`);
      ball.style.left = `${Math.random() * 100}vw`;
      ball.style.top = `${-20 - Math.random() * 60}vh`;
      document.body.appendChild(ball);
    }
  </script>
</body>
</html>
